<script>
const K='touchline_demo_v3',PIN='1234';
const bn=s=>String(s).replace(/\d/g,d=>'০১২৩৪৫৬৭৮৯'[d]);
const tk=n=>'৳'+bn(n);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);
const RULES=['ম্যাচ শেষে স্কোরের স্ক্রিনশট নিয়ে সাপোর্টে পাঠান।','ম্যাচ শুরুর ৫ মিনিট আগে রুম কোড দেওয়া হবে।','কোড আগে পেলেও ম্যাচ নির্ধারিত সময়েই শুরু করতে হবে।','নির্ধারিত সময়ের ৫ মিনিটের মধ্যে জয়েন না করলে প্রতিপক্ষ জয়ী ধরা হবে।','কোড পাওয়া থেকে ম্যাচ শেষ পর্যন্ত স্ক্রিন রেকর্ড করুন এবং একবার ফোনের সময় দেখান।','নেটওয়ার্ক সমস্যায় বের হয়ে গেলে রিফান্ড নেই, প্রতিপক্ষ জয়ী ধরা হবে।','যেকোনো সমস্যায় সাপোর্টে যোগাযোগ করুন।'];
const BN=['২৪ ঘণ্টা সাপোর্ট: টেলিগ্রাম ও হোয়াটসঅ্যাপে','গ্রুপে থাকুন, নোটিশ বোর্ড দেখুন','বিকাশ বা নগদে ব্যালেন্স যোগ করুন'];
let S,lm='l',tab='m',view='',flt='all',adm=false,taps=0,txo=false,bi=0;

{id:1,t:n-12*m,entry:20,prize:35,players:[P('DEMO A',75),P('DEMO B',61)],code:'',st:'open'},
{id:2,t:n+25*m,entry:20,prize:35,players:[P('DEMO C',80)],code:'',st:'open'},

{id:4,t:n+4*36e5,entry:50,prize:85,players:[],code:'',st:'open'}],hist:[],dep:[],wd:[],tx:[]}}

function save(){}
function lbl(t){const d=new Date(t),h=d.getHours(),m=d.getMinutes();return{p:h<4?'রাত':h<6?'ভোর':h<12?'সকাল':h<16?'দুপুর':h<18?'বিকাল':h<20?'সন্ধ্যা':'রাত',hm:bn((h%12||12)+':'+String(m).padStart(2,'0'))}}
function cd(t){const d=t-Date.now();if(d<=0)return null;const s=Math.floor(d/1e3);return[Math.floor(s/3600),Math.floor(s%3600/60),s%60].map(x=>String(x).padStart(2,'0')).join(':')}

function sheet(h){$('#sh').innerHTML=h?`<div class="ov" data-a="close"><div class="sheet">${h}</div></div>`:''}
